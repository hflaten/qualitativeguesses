[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qualitativeguesses"
version = "0.1.0"
description = "Event-triggered paper-trading platform for Equinor news events."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "openai>=1.0",
  "cryptography>=42",
  "psycopg[binary]>=3.2",
  "supabase>=2.6",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
