name: CI

on:
  pull_request:
    branches:
      - main
      - qua-7-create-repository-foundation-and-development-baseline
  push:
    branches:
      - main

jobs:
  python-foundation:
    name: Python foundation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: PYTHONPATH=src make test

      - name: Run import baseline
        run: PYTHONPATH=src make typecheck

